        <p>For immediate release</p>
        <h1>The UI layer your AI agent can learn in one read</h1>
        <p>Lucid UI is a free, open-source UI runtime for the web, built for coding agents. Its whole API reference is about 1,140 tokens, its core is 6.2 KB with no dependencies, and every mistake comes back with a code and a fix.</p>
        <p><strong>TORONTO, ON, November 12, 2026.</strong> Lucid UI today launched a free, open-source UI runtime built for the way software is now written: largely by AI coding agents. Its complete API reference is about 1,140 tokens, small enough for an agent to read before it writes a line. Its components and charts come finished, and its 6.2 KB core needs no dependencies and no build step.</p>
        <p>AI agents now write a large share of new interfaces, usually on a stack of many parts held together by a build. Lucid UI measured that cost in public. It built the same app twice: once with React 19, Tailwind CSS 4 and shadcn/ui, and once with Lucid UI, using the same Vite build. The first runs on 33 packages and ships 94.4 KB; the Lucid UI version runs on one and ships 18.5 KB. The code in the project went from 181 lines in 8 files to 30 lines in one.</p>
        <p>Lucid UI is a handful of readable JavaScript modules. Signals update exactly what changed, and a full set of components is designed together and wired for keyboards and screen readers. Dot-based charts come built in. It runs from a single script tag, from npm, or inside React and Next.js with one component, so app builders such as v0, Lovable and Bolt can use it too. A WordPress plugin, and snippets for Shopify and Squarespace, cover existing sites. The docs come as one file an agent can read whole, with a brief written for 27 coding agents.</p>
        <p>When an agent gets something wrong, Lucid UI says so in words it can act on: each of its 14 diagnostics has a stable code, a plain message and the fix. Builder, Lucid UI's free in-browser workbench, takes that further. Through the Lucid bridge, an agent connected over the Model Context Protocol renders straight into Builder, reads every diagnostic, and repairs its own work.</p>
        <blockquote><p>“Much of the interface code written today comes from an AI agent, and an agent is only as good as what it can hold in its head. I wanted a UI layer it could learn in one read, that tells it exactly what went wrong and how to fix it, and that still looks finished when it's done.”</p><p>Ezra, who designed and built Lucid UI</p></blockquote>
        <h2>Availability</h2>
        <p>Lucid UI is available today, free under the MIT license. It's on npm as @lucidui-dev/core and on the jsDelivr CDN, with the source at github.com/lucidui-dev/lucidui. Builder, the docs and a sandbox of live demo apps are free at lucidui.dev, with no account. The Lucid bridge for MCP-capable agents is on npm as @lucidui-dev/bridge. Lucid Editions, eight finished apps built only with Lucid UI, can be previewed at editions.lucidui.dev.</p>
        <h2>About Lucid UI</h2>
        <p>Lucid UI is a free, open-source UI runtime for the web, built for people and the AI agents that now write much of their code. It pairs fine-grained signals with finished, accessible components and built-in charts in a few kilobytes with no build step, and it is based in Toronto, ON.</p>
