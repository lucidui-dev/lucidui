  <link rel="stylesheet" href="./app.css">
  <script>
    try {
      const theme = localStorage.getItem("vesper:theme");
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
  <style>
    .ed-badge { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; height: 44px; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 0 8px 0 16px; padding-bottom: env(safe-area-inset-bottom); font: 500 12.5px/1 "Bricolage Grotesque", system-ui, sans-serif; color: #e8f1f3; background: #120c09; box-shadow: 0 -1px 0 rgb(200 240 210 / .12); }
    .ed-badge b { font-weight: 600; color: #e8d6a8; }
    .ed-badge a { display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 999px; color: #111; background: #e8d6a8; text-decoration: none; font-weight: 600; }
    .ed-badge a:focus-visible { outline: 2px solid #e8d6a8; outline-offset: 2px; }
    .ed-badge button { position: absolute; right: 8px; display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%; color: rgb(232 241 243 / .6); background: none; cursor: pointer; font: inherit; font-size: 15px; }
    .ed-badge button:hover { color: #e8f1f3; background: rgb(232 241 243 / .08); }
    .ed-badge[hidden] { display: none; }
    body:has(.ed-badge:not([hidden])) { padding-bottom: 44px; }
  </style>
</head>
<body class="lucid-app">
  <div id="app"></div>
  <aside class="ed-badge" id="ed-badge" aria-label="Lucid Editions">
    <span><b>Lucid Editions</b> No. 06 · live preview</span>
    <a href="https://editions.lucidui.dev">Back to Editions</a>
    <button type="button" aria-label="Hide this badge" onclick="document.getElementById('ed-badge').hidden = true">×</button>
  </aside>
  <script>if (window.top !== window.self) document.getElementById("ed-badge").hidden = true;</script>
  <noscript>Vesper needs JavaScript.</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
