<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta property="og:description" content="A market terminal built only with Lucid UI: drag, resize and link 14 live panels, from charts and an order book to news and a heatmap, across saved workspaces. Try the live preview.">
  <meta property="og:url" content="https://editions.lucidui.dev/ledgerline/">
  <meta property="og:image" content="/media/og/editions-ledgerline.jpg">
  <meta property="og:image:width" content="2400">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@lucidui_">
  <meta name="twitter:title" content="Ledgerline · Lucid Editions No. 04">
  <meta name="twitter:description" content="A market terminal you arrange yourself, built only with Lucid UI. Try the live preview.">
  <meta name="twitter:image" content="/media/og/editions-ledgerline.jpg">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&family=JetBrains+Mono:wght@400..700&display=swap">
  <link rel="stylesheet" href="./app.css">
  <script>
    try {
      const theme = localStorage.getItem("ledgerline:theme");
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
  <style>
    .ed-badge { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; height: 44px; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 0 8px 0 16px; padding-bottom: env(safe-area-inset-bottom); font: 500 12.5px/1 "Space Grotesk", system-ui, sans-serif; color: #e8f1f3; background: #071028; box-shadow: 0 -1px 0 rgb(150 180 255 / .14); }
    .ed-badge b { font-weight: 600; color: #e8d6a8; }
    .ed-badge a { display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 999px; color: #111; background: #e8d6a8; text-decoration: none; font-weight: 600; }
    .ed-badge a:focus-visible { outline: 2px solid #e8d6a8; outline-offset: 2px; }
    .ed-badge button { position: absolute; right: 8px; display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%; color: rgb(232 241 243 / .6); background: none; cursor: pointer; font: inherit; font-size: 15px; }
    .ed-badge button:hover { color: #e8f1f3; background: rgb(232 241 243 / .08); }
    .ed-badge[hidden] { display: none; }
    body:has(.ed-badge:not([hidden])) .ll { height: calc(100dvh - 44px); }
    @media (max-width: 640px) { .ed-badge span { display: none; } }
  </style>
</head>
<body class="lucid-app">
  <div id="app"></div>
  <aside class="ed-badge" id="ed-badge" aria-label="Lucid Editions">
    <span><b>Lucid Editions</b> No. 04 · live preview</span>
    <a href="https://editions.lucidui.dev">Back to Editions</a>
    <button type="button" aria-label="Hide this badge" onclick="document.getElementById('ed-badge').hidden = true">×</button>
  </aside>
  <script>if (window.top !== window.self) document.getElementById("ed-badge").hidden = true;</script>
  <noscript>Ledgerline needs JavaScript.</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
