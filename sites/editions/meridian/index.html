  <meta name="twitter:card" content="summary_large_image">

  <meta name="twitter:title" content="Meridian · Lucid Editions No. 01">

  <link rel="stylesheet" href="./app.css">
  <script>
    try {
      const theme = localStorage.getItem("meridian:theme");
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
  <style>
    .ed-badge { position: fixed; z-index: 30; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: 999px; font: 500 12.5px/1 "Geist", system-ui, sans-serif; color: #f5f2ea; background: rgb(14 14 14 / .88); box-shadow: 0 0 0 1px rgb(232 214 168 / .3), 0 18px 40px -18px #000; backdrop-filter: blur(10px); }
    .ed-badge b { font-weight: 600; color: #e8d6a8; }
    .ed-badge a { display: inline-flex; align-items: center; height: 26px; padding: 0 12px; border-radius: 999px; color: #111; background: #e8d6a8; text-decoration: none; font-weight: 600; }
    .ed-badge a:focus-visible { outline: 2px solid #e8d6a8; outline-offset: 2px; }
    .ed-badge button { display: grid; place-items: center; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 50%; color: rgb(245 242 234 / .6); background: none; cursor: pointer; font: inherit; font-size: 15px; }
    .ed-badge button:hover { color: #f5f2ea; background: rgb(245 242 234 / .08); }
    .ed-badge[hidden] { display: none; }
    @media (max-width: 900px) { .ed-badge { bottom: 12px; right: 12px; } .ed-badge span { display: none; } }
  </style>
</head>
<body class="lucid-app">
  <div id="app"></div>
  <aside class="ed-badge" id="ed-badge" aria-label="Lucid Editions">
    <span><b>Lucid Editions</b> No. 01 · live preview</span>
    <a href="https://editions.lucidui.dev">Back to Editions</a>
    <button type="button" aria-label="Hide this badge" onclick="document.getElementById('ed-badge').hidden = true">×</button>
  </aside>
  <script>if (window.top !== window.self) document.getElementById("ed-badge").hidden = true;</script>
  <noscript>Meridian needs JavaScript.</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
