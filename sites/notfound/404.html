<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found · Lucid UI</title>
  <link rel="icon" href="/media/icons/favicon.ico" sizes="48x48">
  <link rel="icon" href="/media/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@lucidui-dev/core@0.3/bundle/lucid.css">
  <script>
    try {
      const theme = localStorage.getItem("lucid-site:theme");
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
  <style>
    :root {
      color-scheme: light dark;
      --nf-bg: light-dark(#f3f3f1, #0b0b0b);
      --nf-lit: light-dark(#111111, #f5f2ea);
      --nf-dim: light-dark(rgb(17 17 17 / .07), rgb(245 242 234 / .07));
      --nf-gold: light-dark(#8a6d1f, #e8d6a8);
    }
    :root[data-theme="light"] { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { min-height: 100dvh; background: var(--nf-bg); overflow-x: hidden; }
    .nf { position: relative; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; padding: 24px 16px; }
    .nf-top { width: min(100%, 1080px); margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .nf-brand { display: inline-flex; }
    .nf-brand img { display: block; height: 24px; width: auto; }
    .nf-brand .on-dark { display: none; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .nf-brand .on-light { display: none; } :root:not([data-theme="light"]) .nf-brand .on-dark { display: block; } }
    :root[data-theme="dark"] .nf-brand .on-light { display: none; }
    :root[data-theme="dark"] .nf-brand .on-dark { display: block; }
    .nf-main { display: grid; place-items: center; text-align: center; padding: 32px 0; }
    .nf-stack { display: flex; flex-direction: column; align-items: center; width: min(100%, 640px); }
    .nf-glyph { position: relative; width: min(100%, 600px); aspect-ratio: 23 / 11; }
    .nf-glyph canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .nf-title { margin: 40px 0 0; font: 600 clamp(30px, 5vw, 46px)/1.08 var(--lucid-font-sans); letter-spacing: -.035em; color: var(--lucid-ink); text-wrap: balance; }
    .nf-sub { margin: 14px 0 0; max-width: 460px; font-size: 16px; line-height: 1.55; color: var(--lucid-ink-2); text-wrap: pretty; }
    .nf-diag { width: 100%; margin-top: 32px; text-align: left; border-radius: 14px; background: var(--lucid-surface); box-shadow: 0 0 0 1px var(--lucid-line), var(--lucid-shadow-xs); overflow: hidden; }
    .nf-diag-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--lucid-line); font: 500 12.5px/1 var(--lucid-font-mono); color: var(--lucid-ink-2); }
    .nf-diag-level { padding: 3px 7px; border-radius: 6px; font-size: 11px; color: var(--nf-gold); background: color-mix(in oklab, var(--nf-gold) 14%, transparent); }
    .nf-diag-body { padding: 14px 16px 16px; font-size: 14px; line-height: 1.55; color: var(--lucid-ink-2); }
    .nf-diag-body b { color: var(--lucid-ink); font-weight: 500; }
    .nf-diag-body code { font: 500 13px var(--lucid-font-mono); color: var(--lucid-ink); overflow-wrap: anywhere; }
    .nf-fix { margin-top: 8px; }
    .nf-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 28px; }
    .nf-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 6px; margin-top: 18px; }
    .nf-links a { padding: 6px 10px; border-radius: 8px; font-size: 13.5px; font-weight: 500; color: var(--lucid-ink-2); text-decoration: none; transition: color 160ms, background-color 160ms; }
    .nf-links a:hover { color: var(--lucid-ink); background: var(--lucid-hover); }
    .nf-links a:focus-visible { outline: 2px solid var(--nf-gold); outline-offset: 1px; }
    .nf-foot { text-align: center; font-size: 12.5px; color: var(--lucid-ink-3); }
    .nf-foot b { color: var(--nf-gold); font-weight: 500; }
    .nf-caption { display: flex; justify-content: space-between; width: 100%; margin-top: 12px; font: 500 11.5px/1 var(--lucid-font-mono); color: var(--lucid-ink-3); }
    .nf-score b { color: var(--nf-gold); font-weight: 600; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="lucid-app">
  <div class="nf">
    <header class="nf-top">
      <a class="nf-brand" href="https://lucidui.dev" aria-label="Lucid UI home">
        <img class="on-light" src="/media/logo/lucidui-wordmark-on-light.svg" alt="Lucid UI" width="122" height="24">
        <img class="on-dark" src="/media/logo/lucidui-wordmark-on-dark.svg" alt="Lucid UI" width="122" height="24">
      </a>
    </header>
    <main class="nf-main" id="app"></main>
    <footer class="nf-foot" id="foot">It ate every dot on the graph except the ones that spell the problem.</footer>
  </div>
  <script type="module">
    import { h, mount, signal, Button } from "https://cdn.jsdelivr.net/npm/@lucidui-dev/core@0.3/bundle/lucid.js";

    const DIGITS = {
      4: ["...#.", "..##.", ".#.#.", "#..#.", "#####", "...#.", "...#."],
      0: [".###.", "#...#", "#...#", "#...#", "#...#", "#...#", ".###."]
    };
    const COLS = 23;
    const ROWS = 11;
    const OFFSET = { col: 3, row: 2 };
    const SPEED = 30;
    const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const here = location.hostname.replace(/^www\./, "") + location.pathname;
    const eaten = signal(0);
    const done = signal(false);

    const keep = new Set();
    ["4", "0", "4"].forEach((digit, i) => DIGITS[digit].forEach((line, row) => [...line].forEach((cell, col) => {
      if (cell === "#") keep.add(`${OFFSET.col + i * 6 + col},${OFFSET.row + row}`);
    })));
    const food = COLS * ROWS - keep.size;

    const path = [];
    for (let row = 0; row < ROWS; row++) {
      for (let k = 0; k < COLS; k++) path.push({ col: row % 2 ? COLS - 1 - k : k, row });
    }

    let gone = new Set();
    let clock = 0;
    let last = 0;

    const canvas = h("canvas", { "aria-hidden": "true" });
    const glyph = h("div", { class: "nf-glyph", role: "img", aria: { label: "A dot graph being eaten, leaving only the dots that spell 404" } }, canvas);

    let geometry;
    const measure = () => {
      const box = canvas.getBoundingClientRect();
      const ratio = devicePixelRatio || 1;
      canvas.width = box.width * ratio;
      canvas.height = box.height * ratio;
      geometry = { box, ratio, pitch: box.width / COLS };
    };
    const centre = (col, row) => ({ x: geometry.pitch * (col + 0.5), y: geometry.pitch * (row + 0.5) });
    const probe = h("span", { "aria-hidden": "true", style: { position: "absolute", visibility: "hidden" } });
    document.body.append(probe);
    const colour = name => {
      probe.style.color = `var(${name})`;
      return getComputedStyle(probe).color;
    };

    const reset = () => {
      gone = new Set();
      clock = 0;
      last = 0;
      eaten.value = 0;
      done.value = false;
    };

    const draw = now => {
      const dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
      last = now;
      if (still) clock = path.length;
      else if (!done.value) clock = Math.min(path.length, clock + dt * SPEED);
      const step = Math.min(path.length - 1, Math.floor(clock));
      for (let k = 0; k <= step; k++) {
        const cell = path[k];
        const key = `${cell.col},${cell.row}`;
        if (!keep.has(key) && !gone.has(key)) gone.add(key);
      }
      if (gone.size !== eaten.value) eaten.value = gone.size;
      if (clock >= path.length && !done.value) done.value = true;

      const { ratio, pitch, box } = geometry;
      const ctx = canvas.getContext("2d");
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      ctx.clearRect(0, 0, box.width, box.height);
      const ink = colour("--nf-lit");
      const dim = colour("--nf-dim");
      const muted = colour("--lucid-ink-3");
      const gold = colour("--nf-gold");

      ctx.fillStyle = dim;
      for (let row = 0; row < ROWS; row++) {
        const p = centre(0, row);
        ctx.fillRect(0, p.y - 0.5, box.width, 1);
      }

      for (let col = 0; col < COLS; col++) for (let row = 0; row < ROWS; row++) {
        const key = `${col},${row}`;
        const p = centre(col, row);
        if (keep.has(key)) {
          ctx.fillStyle = ink;
          ctx.beginPath();
          ctx.arc(p.x, p.y, pitch * 0.36, 0, Math.PI * 2);
          ctx.fill();
        } else if (!gone.has(key)) {
          ctx.fillStyle = muted;
          ctx.globalAlpha = 0.55;
          ctx.beginPath();
          ctx.arc(p.x, p.y, pitch * 0.16, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }

      if (!done.value) {
        const k = Math.min(path.length - 1, Math.floor(clock));
        const a = path[k];
        const b = path[Math.min(path.length - 1, k + 1)];
        const f = clock - k;
        const pa = centre(a.col, a.row);
        const pb = centre(b.col, b.row);
        const x = pa.x + (pb.x - pa.x) * f;
        const y = pa.y + (pb.y - pa.y) * f;
        const heading = Math.atan2(pb.y - pa.y, pb.x - pa.x) || (a.row % 2 ? Math.PI : 0);
        const mouth = (Math.sin(now / 55) * 0.5 + 0.5) * 0.9 + 0.08;
        const r = pitch * 0.62;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(heading);
        ctx.fillStyle = gold;
        ctx.shadowColor = gold;
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, r, mouth / 2, Math.PI * 2 - mouth / 2);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      requestAnimationFrame(draw);
    };

    addEventListener("resize", measure);

    const site = location.hostname.split(".")[0];
    const home = location.hostname.endsWith("lucidui.dev") ? `https://${location.hostname}` : "/";

    mount(() => h("div", { class: "nf-stack" },
      glyph,
      h("div", { class: "nf-caption" },
        h("span", "Pages found at this address"),
        h("span", { class: "nf-score" }, "Dots eaten ", h("b", () => `${eaten.value}/${food}`))),
      h("h1", { class: "nf-title" }, () => (done.value ? "Everything got eaten. Except the problem." : "This page got eaten.")),
      h("p", { class: "nf-sub" }, "Nothing lives at this address. It may have moved, or the link may have a typo."),
      h("div", { class: "nf-diag", role: "note" },
        h("div", { class: "nf-diag-head" }, h("span", { class: "nf-diag-level" }, "warn"), "page-not-found"),
        h("div", { class: "nf-diag-body" },
          h("div", h("b", "Nothing lives at "), h("code", here), h("b", ".")),
          h("div", { class: "nf-fix" }, "Fix: head back to the start of this site, or pick another below."))),
      h("div", { class: "nf-actions" },
        Button({ variant: "primary", href: home, icon: "chevron-left" }, site === "lucidui" || site === "www" ? "Back to Lucid UI" : `Back to ${site}`),
        still ? null : Button({ icon: "zap", onClick: reset }, "Chomp again")),
      h("nav", { class: "nf-links", aria: { label: "Lucid UI sites" } },
        [["Site", "https://lucidui.dev"], ["Builder", "https://build.lucidui.dev"], ["Sandbox", "https://sandbox.lucidui.dev"], ["Docs", "https://docs.lucidui.dev"], ["Changelog", "https://changelog.lucidui.dev"]]
          .map(([label, href]) => h("a", { href }, label)))), "#app");

    measure();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
